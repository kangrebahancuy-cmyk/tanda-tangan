name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: ci
      ADMIN_USERNAME: ci
      ADMIN_PASSWORD_HASH: '$2b$12$invalidinvalidinvalidinvalidinvalidinvalidinvalidinvalid'
      SESSION_SECRET: ci-test-secret-please-replace-in-production-32chars
      BLOB_READ_WRITE_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: npm run build
